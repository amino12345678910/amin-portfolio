<?php
/**
 * COMPREHENSIVE PHP SECURITY CONFIGURATION
 * For cPanel Shared Hosting Environment
 * 
 * Include this file at the top of your main application
 * require_once 'config/security.conf';
 */

// ============================================================
// SECURITY CONSTANTS
// ============================================================

define('SECURITY_ENABLED', true);
define('MAX_LOGIN_ATTEMPTS', 5);
define('LOGIN_LOCKOUT_TIME', 1800); // 30 minutes
define('MAX_UPLOAD_SIZE', 10 * 1024 * 1024); // 10MB
define('ALLOWED_UPLOAD_TYPES', ['jpg', 'jpeg', 'png', 'gif', 'pdf', 'doc', 'docx', 'txt']);
define('SESSION_LIFETIME', 3600); // 1 hour
define('CSRF_TOKEN_LIFETIME', 1800); // 30 minutes

// ============================================================
// PHP SECURITY SETTINGS
// ============================================================

if (SECURITY_ENABLED) {
    // Basic PHP security
    ini_set('display_errors', 0);
    ini_set('log_errors', 1);
    ini_set('error_log', dirname(__DIR__) . '/logs/php_errors.log');
    
    // Disable dangerous functions (if allowed by host)
    if (function_exists('ini_set')) {
        @ini_set('disable_functions', 'exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,file_get_contents,file_put_contents,fwrite,fopen,fclose,readfile');
    }
    
    // File uploads
    ini_set('file_uploads', 1);
    ini_set('upload_max_filesize', '10M');
    ini_set('post_max_size', '10M');
    ini_set('max_file_uploads', 5);
    
    // Memory and execution limits
    ini_set('memory_limit', '128M');
    ini_set('max_execution_time', 30);
    ini_set('max_input_time', 30);
    ini_set('max_input_vars', 1000);
    
    // SQL injection protection
    ini_set('magic_quotes_gpc', 0);
    ini_set('magic_quotes_runtime', 0);
    ini_set('magic_quotes_sybase', 0);
    
    // Hide PHP version
    ini_set('expose_php', 0);
    
    // Session security
    ini_set('session.cookie_httponly', 1);
    ini_set('session.cookie_secure', isset($_SERVER['HTTPS']) ? 1 : 0);
    ini_set('session.use_strict_mode', 1);
    ini_set('session.cookie_samesite', 'Strict');
    ini_set('session.gc_maxlifetime', SESSION_LIFETIME);
    ini_set('session.entropy_file', '/dev/urandom');
    ini_set('session.entropy_length', 32);
    ini_set('session.hash_function', 'sha256');
    ini_set('session.hash_bits_per_character', 5);
    
    // Auto globals protection
    ini_set('register_globals', 0);
    ini_set('auto_prepend_file', '');
    ini_set('auto_append_file', '');
    
    // Include/require protection
    ini_set('allow_url_include', 0);
    ini_set('allow_url_fopen', 0);
    
    // Other security settings
    ini_set('default_socket_timeout', 10);
    ini_set('user_agent', 'SecurePHP/1.0');
}

// ============================================================
// SECURITY FUNCTIONS
// ============================================================

class SecurityManager {
    private static $instance = null;
    private $logFile;
    private $configFile;
    
    private function __construct() {
        $this->logFile = dirname(__DIR__) . '/logs/security.log';
        $this->configFile = __FILE__;
        $this->initializeSecurity();
    }
    
    public static function getInstance() {
        if (self::$instance === null) {
            self::$instance = new self();
        }
        return self::$instance;
    }
    
    private function initializeSecurity() {
        // Start secure session
        $this->startSecureSession();
        
        // Initialize CSRF protection
        $this->initCSRF();
        
        // Start security monitoring
        $this->logSecurityEvent('session_start', 'Security session initialized');
    }
    
    /**
     * Start secure session with enhanced security
     */
    public function startSecureSession() {
        if (session_status() === PHP_SESSION_NONE) {
            // Set session name
            session_name('SECURE_PHPSESSID');
            
            // Configure session parameters
            session_set_cookie_params([
                'lifetime' => SESSION_LIFETIME,
                'path' => '/',
                'domain' => $_SERVER['HTTP_HOST'] ?? '',
                'secure' => isset($_SERVER['HTTPS']),
                'httponly' => true,
                'samesite' => 'Strict'
            ]);
            
            session_start();
            
            // Regenerate session ID periodically
            if (!isset($_SESSION['last_regeneration'])) {
                session_regenerate_id(true);
                $_SESSION['last_regeneration'] = time();
            } elseif (time() - $_SESSION['last_regeneration'] > 300) { // 5 minutes
                session_regenerate_id(true);
                $_SESSION['last_regeneration'] = time();
            }
            
            // Set session fingerprint
            if (!isset($_SESSION['fingerprint'])) {
                $_SESSION['fingerprint'] = $this->generateFingerprint();
            } elseif ($_SESSION['fingerprint'] !== $this->generateFingerprint()) {
                // Session hijacking detected
                $this->logSecurityEvent('session_hijack', 'Session fingerprint mismatch');
                session_destroy();
                $this->terminateWithError('Security violation detected');
            }
        }
    }
    
    /**
     * Generate browser fingerprint for session validation
     */
    private function generateFingerprint() {
        return hash('sha256', 
            ($_SERVER['HTTP_USER_AGENT'] ?? '') . 
            ($_SERVER['HTTP_ACCEPT_LANGUAGE'] ?? '') . 
            ($_SERVER['REMOTE_ADDR'] ?? '') .
            date('Y-m-d') // Reset daily
        );
    }
    
    /**
     * Initialize CSRF protection
     */
    public function initCSRF() {
        if (!isset($_SESSION['csrf_token']) || 
            !isset($_SESSION['csrf_time']) || 
            (time() - $_SESSION['csrf_time']) > CSRF_TOKEN_LIFETIME) {
            $_SESSION['csrf_token'] = bin2hex(random_bytes(32));
            $_SESSION['csrf_time'] = time();
        }
    }
    
    /**
     * Get CSRF token for forms
     */
    public function getCSRFToken() {
        return $_SESSION['csrf_token'] ?? '';
    }
    
    /**
     * Validate CSRF token
     */
    public function validateCSRF($token) {
        if (!isset($_SESSION['csrf_token']) || !hash_equals($_SESSION['csrf_token'], $token)) {
            $this->logSecurityEvent('csrf_fail', 'CSRF token validation failed');
            return false;
        }
        return true;
    }
    
    /**
     * Sanitize input data
     */
    public function sanitizeInput($input, $type = 'string') {
        switch ($type) {
            case 'email':
                return filter_var($input, FILTER_SANITIZE_EMAIL);
            case 'url':
                return filter_var($input, FILTER_SANITIZE_URL);
            case 'int':
                return filter_var($input, FILTER_SANITIZE_NUMBER_INT);
            case 'float':
                return filter_var($input, FILTER_SANITIZE_NUMBER_FLOAT, FILTER_FLAG_ALLOW_FRACTION);
            case 'html':
                return htmlspecialchars($input, ENT_QUOTES | ENT_HTML5, 'UTF-8');
            case 'sql':
                return addslashes($input);
            default:
                return filter_var($input, FILTER_SANITIZE_STRING);
        }
    }
    
    /**
     * Validate input data
     */
    public function validateInput($input, $type, $options = []) {
        switch ($type) {
            case 'email':
                return filter_var($input, FILTER_VALIDATE_EMAIL);
            case 'url':
                return filter_var($input, FILTER_VALIDATE_URL);
            case 'int':
                return filter_var($input, FILTER_VALIDATE_INT, $options);
            case 'float':
                return filter_var($input, FILTER_VALIDATE_FLOAT, $options);
            case 'ip':
                return filter_var($input, FILTER_VALIDATE_IP);
            case 'regex':
                return isset($options['pattern']) ? preg_match($options['pattern'], $input) : false;
            default:
                return !empty($input);
        }
    }
    
    /**
     * Check for brute force attacks
     */
    public function checkBruteForce($identifier, $maxAttempts = MAX_LOGIN_ATTEMPTS) {
        $attemptsFile = dirname(__DIR__) . '/logs/login_attempts.json';
        $attempts = [];
        
        if (file_exists($attemptsFile)) {
            $attempts = json_decode(file_get_contents($attemptsFile), true) ?: [];
        }
        
        $now = time();
        $key = hash('sha256', $identifier);
        
        // Clean old attempts
        if (isset($attempts[$key])) {
            $attempts[$key] = array_filter($attempts[$key], function($time) use ($now) {
                return ($now - $time) < LOGIN_LOCKOUT_TIME;
            });
        }
        
        // Check if blocked
        if (isset($attempts[$key]) && count($attempts[$key]) >= $maxAttempts) {
            $this->logSecurityEvent('brute_force', "Brute force detected for: $identifier");
            return false;
        }
        
        return true;
    }
    
    /**
     * Record failed login attempt
     */
    public function recordFailedAttempt($identifier) {
        $attemptsFile = dirname(__DIR__) . '/logs/login_attempts.json';
        $attempts = [];
        
        if (file_exists($attemptsFile)) {
            $attempts = json_decode(file_get_contents($attemptsFile), true) ?: [];
        }
        
        $key = hash('sha256', $identifier);
        if (!isset($attempts[$key])) {
            $attempts[$key] = [];
        }
        
        $attempts[$key][] = time();
        
        file_put_contents($attemptsFile, json_encode($attempts), LOCK_EX);
        $this->logSecurityEvent('login_fail', "Failed login attempt for: $identifier");
    }
    
    /**
     * Validate file upload
     */
    public function validateFileUpload($file) {
        $errors = [];
        
        // Check if file was uploaded
        if (!isset($file['error']) || is_array($file['error'])) {
            $errors[] = 'Invalid file upload parameters';
            return $errors;
        }
        
        // Check upload errors
        switch ($file['error']) {
            case UPLOAD_ERR_OK:
                break;
            case UPLOAD_ERR_NO_FILE:
                $errors[] = 'No file was uploaded';
                return $errors;
            case UPLOAD_ERR_INI_SIZE:
            case UPLOAD_ERR_FORM_SIZE:
                $errors[] = 'File size exceeds limit';
                return $errors;
            default:
                $errors[] = 'Unknown upload error';
                return $errors;
        }
        
        // Check file size
        if ($file['size'] > MAX_UPLOAD_SIZE) {
            $errors[] = 'File size exceeds maximum allowed size';
        }
        
        // Check file type
        $finfo = new finfo(FILEINFO_MIME_TYPE);
        $mimeType = $finfo->file($file['tmp_name']);
        $extension = strtolower(pathinfo($file['name'], PATHINFO_EXTENSION));
        
        if (!in_array($extension, ALLOWED_UPLOAD_TYPES)) {
            $errors[] = 'File type not allowed';
        }
        
        // Additional security checks
        if (strpos($file['name'], '..') !== false) {
            $errors[] = 'Invalid file name';
        }
        
        // Check for malicious content (basic)
        $content = file_get_contents($file['tmp_name']);
        $maliciousPatterns = ['<?php', '<%', '<script', 'eval(', 'base64_decode'];
        
        foreach ($maliciousPatterns as $pattern) {
            if (stripos($content, $pattern) !== false) {
                $errors[] = 'Malicious content detected';
                $this->logSecurityEvent('malicious_upload', 'Malicious file upload attempt: ' . $file['name']);
                break;
            }
        }
        
        return $errors;
    }
    
    /**
     * Log security events
     */
    public function logSecurityEvent($type, $message, $severity = 'INFO') {
        $logEntry = [
            'timestamp' => date('Y-m-d H:i:s'),
            'type' => $type,
            'message' => $message,
            'severity' => $severity,
            'ip' => $_SERVER['REMOTE_ADDR'] ?? 'unknown',
            'user_agent' => $_SERVER['HTTP_USER_AGENT'] ?? 'unknown',
            'request_uri' => $_SERVER['REQUEST_URI'] ?? 'unknown'
        ];
        
        $logLine = json_encode($logEntry) . PHP_EOL;
        
        // Ensure logs directory exists
        $logsDir = dirname($this->logFile);
        if (!is_dir($logsDir)) {
            @mkdir($logsDir, 0755, true);
        }
        
        @file_put_contents($this->logFile, $logLine, FILE_APPEND | LOCK_EX);
        
        // If critical, also log to error_log
        if ($severity === 'CRITICAL' || $severity === 'ERROR') {
            error_log("SECURITY [$severity]: $message");
        }
    }
    
    /**
     * Terminate script with security error
     */
    public function terminateWithError($message = 'Security violation detected') {
        http_response_code(403);
        $this->logSecurityEvent('security_violation', $message, 'CRITICAL');
        
        // Send to error page or API response
        if (isset($_SERVER['HTTP_ACCEPT']) && strpos($_SERVER['HTTP_ACCEPT'], 'application/json') !== false) {
            header('Content-Type: application/json');
            echo json_encode(['error' => 'Access denied', 'code' => 403]);
        } else {
            include dirname(__DIR__) . '/errors/403.html';
        }
        
        exit;
    }
    
    /**
     * Rate limiting check
     */
    public function checkRateLimit($identifier, $limit = 100, $window = 3600) {
        $rateLimitFile = dirname(__DIR__) . '/logs/rate_limits.json';
        $rateLimits = [];
        
        if (file_exists($rateLimitFile)) {
            $rateLimits = json_decode(file_get_contents($rateLimitFile), true) ?: [];
        }
        
        $now = time();
        $key = hash('sha256', $identifier);
        $windowStart = $now - $window;
        
        // Clean old entries
        if (isset($rateLimits[$key])) {
            $rateLimits[$key] = array_filter($rateLimits[$key], function($time) use ($windowStart) {
                return $time > $windowStart;
            });
        }
        
        // Check limit
        if (isset($rateLimits[$key]) && count($rateLimits[$key]) >= $limit) {
            $this->logSecurityEvent('rate_limit', "Rate limit exceeded for: $identifier");
            return false;
        }
        
        // Record this request
        if (!isset($rateLimits[$key])) {
            $rateLimits[$key] = [];
        }
        $rateLimits[$key][] = $now;
        
        file_put_contents($rateLimitFile, json_encode($rateLimits), LOCK_EX);
        
        return true;
    }
}

// ============================================================
// AUTO-INITIALIZE SECURITY
// ============================================================

// Auto-start security if enabled
if (SECURITY_ENABLED && !defined('SECURITY_INITIALIZED')) {
    define('SECURITY_INITIALIZED', true);
    
    // Initialize security manager
    $security = SecurityManager::getInstance();
    
    // Check rate limiting for requests
    $clientIP = $_SERVER['REMOTE_ADDR'] ?? 'unknown';
    if (!$security->checkRateLimit($clientIP, 1000, 3600)) { // 1000 requests per hour
        $security->terminateWithError('Rate limit exceeded');
    }
    
    // Basic input validation for critical parameters
    $dangerousParams = ['eval', 'exec', 'system', 'shell_exec', 'passthru'];
    foreach ($_REQUEST as $key => $value) {
        if (is_string($value)) {
            foreach ($dangerousParams as $dangerous) {
                if (stripos($value, $dangerous) !== false) {
                    $security->logSecurityEvent('dangerous_input', "Dangerous parameter detected: $key", 'WARNING');
                }
            }
        }
    }
}

// Make security manager globally available
if (!function_exists('security')) {
    function security() {
        return SecurityManager::getInstance();
    }
}

?>