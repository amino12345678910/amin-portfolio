<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Non Trouvée | Safonas</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://safonas.com/404.shtml" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }

        .error-code {
            font-size: 8em;
            font-weight: bold;
            color: #3498db;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            line-height: 1;
        }

        .error-title {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #2c3e50;
            font-weight: 300;
        }

        .error-message {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .suggestions {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 20px;
            margin: 30px 0;
            text-align: left;
            border-radius: 5px;
        }

        .suggestions h3 {
            color: #3498db;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .suggestions ul {
            list-style: none;
            padding: 0;
        }

        .suggestions li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .suggestions li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #3498db;
            font-weight: bold;
        }

        .back-button {
            display: inline-block;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin: 0 10px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .search-box {
            margin: 30px 0;
        }

        .search-box input {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3498db;
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 40px 20px;
            }

            .error-code {
                font-size: 5em;
            }

            .error-title {
                font-size: 2em;
            }

            .error-message {
                font-size: 1.1em;
            }

            .back-button {
                display: block;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title">Page Non Trouvée</div>
        <div class="error-message">
            Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
        </div>

        <div class="search-box">
            <input type="text" placeholder="Rechercher sur Safonas..." onkeypress="if(event.key==='Enter') window.location.href='/blog/?search='+this.value">
        </div>

        <div class="suggestions">
            <h3>Suggestions</h3>
            <ul>
                <li>Retournez à la page d'accueil</li>
                <li>Consultez notre blog d'articles IA</li>
                <li>Découvrez nos services d'intelligence artificielle</li>
                <li>Utilisez le formulaire de recherche ci-dessus</li>
            </ul>
        </div>

        <div>
            <a href="/" class="back-button">Accueil</a>
            <a href="/blog/" class="back-button">Blog</a>
        </div>
    </div>
</body>
</html>
